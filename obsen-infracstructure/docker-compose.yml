version: "3.8"

services:
  # =========================================================================
  # 1. BASE DE DONNÉES PRINCIPALE (PostgreSQL pour Backend & Keycloak)
  # =========================================================================
  postgres:
    image: postgres:15
    container_name: obsen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obsen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsen_password}
      POSTGRES_DB: ${POSTGRES_DB:-obsen_sre_db}
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obsen_user} -d ${POSTGRES_DB:-obsen_sre_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - obsen_postgres_data:/var/lib/postgresql/data
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    networks:
      - obsen-network

  # =========================================================================
  # 2. INTERFACE DE GESTION BD POSTGRES (Port : 5059)
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: obsen-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@obsen.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
    ports:
      - "5059:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - obsen-network

  # =========================================================================
  # 3. SÉCURITÉ / GESTION DES ACCÈS (Port : 7089)
  # =========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: obsen-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-obsen_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-obsen_password}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_HTTP_MANAGEMENT_PORT: 9000
    ports:
      - "7089:8080"
    volumes:
      - C:\Users\HP\IdeaProjects\obsen\obsen-infracstructure\keycloak-theme:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - obsen-network

  # =========================================================================
  # 4. OBSERVABILITÉ & COLLECTEURS (Ports : 9095, 3105, 3005 & 8081)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: obsen-prometheus
    restart: unless-stopped
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - obsen-network

  loki:
    image: grafana/loki:latest
    container_name: obsen-loki
    restart: unless-stopped
    ports:
      - "3105:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - obsen-network

  grafana:
    image: grafana/grafana:latest
    container_name: obsen-grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=true
    volumes:
      - obsen_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - obsen-network

  promtail:
    image: grafana/promtail:latest
    container_name: obsen-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - obsen-network
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: obsen-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - obsen-network

  # =========================================================================
  # 5. AUTOMATISATION / ENGINE SRE (Port : 5679)
  # =========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: obsen-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    volumes:
      - obsen_n8n_data:/home/node/.n8n
    networks:
      - obsen-network

# =========================================================================
# CONFIGURATION DES RÉSEAUX ET VOLUMES
# =========================================================================
networks:
  obsen-network:
    driver: bridge

volumes:
  obsen_postgres_data:
  obsen_n8n_data:
  obsen_grafana_data: