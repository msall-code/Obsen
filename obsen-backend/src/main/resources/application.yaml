spring:
  application:
    name: obsen-backend

  datasource:
    url: jdbc:postgresql://localhost:5439/obsen_sre_db
    username: obsen_user
    password: ${DB_PASSWORD:obsen_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # URL exacte confirmée par le JSON de découverte Keycloak
          issuer-uri: http://localhost:7089/auth/realms/Obsen-realm

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
      cors:
        allowed-origins: "http://localhost:5173"
        allowed-methods: "GET,POST"
  endpoint:
    prometheus:
      enabled: true

keycloak:
  server-url: http://localhost:7089/auth # Ajout du prefixe /auth pour l'Admin Client
  realm: Obsen-realm                     # Utilisation du realm obsen
  client-id: admin-cli
  username: admin
  password: admin